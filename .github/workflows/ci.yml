name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            pkg-config \
            libssl-dev \
            libcurl4-openssl-dev \
            libzmq3-dev \
            libjsoncpp-dev \
            libyaml-cpp-dev \
            librocksdb-dev \
            zlib1g-dev \
            libbz2-dev \
            liblz4-dev \
            libsnappy-dev \
            libsecp256k1-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env

      - name: Configure
        run: |
          cmake -S . -B build -DBUILD_TESTS=ON

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: C++ tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          pytest

      - name: Mempool integration test
        env:
          AILEE_NODE_URL: http://127.0.0.1:8080
          AILEE_NETFLOW_ENABLE: '0'
          AILEE_ORCHESTRATION_ENABLE: '0'
        run: |
          set -euo pipefail
          ./build/ailee_node > ailee-node.log 2>&1 &
          node_pid=$!
          cleanup() {
            status=$?
            trap - EXIT
            kill "$node_pid" 2>/dev/null || true
            wait "$node_pid" 2>/dev/null || true
            cat ailee-node.log
            exit "$status"
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent "${AILEE_NODE_URL}/api/l2/state" >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$node_pid" 2>/dev/null; then
              echo "AILEE node exited before becoming ready"
              cat ailee-node.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Timed out waiting for the AILEE node"
            cat ailee-node.log
            exit 1
          fi

          pytest -m integration tests/test_mempool_integration.py

      - name: TypeScript build and tests
        run: |
          npm ci
          npm run typecheck
          npm test -- --runInBand

      - name: Release metadata consistency
        run: ./scripts/check-metadata.sh

  heartbeat-ignite:
    needs: build-and-test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            pkg-config \
            libssl-dev \
            libcurl4-openssl-dev \
            libzmq3-dev \
            libjsoncpp-dev \
            libyaml-cpp-dev \
            librocksdb-dev \
            zlib1g-dev \
            libbz2-dev \
            liblz4-dev \
            libsnappy-dev \
            libsecp256k1-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env

      - name: Configure (Heartbeat Mode)
        run: |
          cmake -S . -B build -DENABLE_HEARTBEAT=ON -DBUILD_TESTS=ON

      - name: Build (Heartbeat Mode)
        run: |
          cmake --build build --config Release --parallel

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure

      - name: Ignite Heartbeat
        run: |
          timeout 45s ./build/ailee_node --heartbeat --simulate-wnn --ticks 500 \
            | tee heartbeat_log.txt

      - name: Upload Heartbeat Log
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-log
          path: heartbeat_log.txt
